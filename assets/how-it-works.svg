<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1200" height="430" fill="#FFFFFF" rx="12"/>
<text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1F3B">How Friday plans your week</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9EA2C8"/></marker></defs>
<g font-size="15">
<rect x="30" y="80" width="200" height="150" rx="12" fill="#EEF2FF" stroke="#8FB8FF"/><text x="130" y="110" text-anchor="middle" font-weight="700" fill="#1B1F3B">0 · Orient &amp; harvest</text><text x="130" y="140" text-anchor="middle" fill="#444">Parallel worker agents</text><text x="130" y="162" text-anchor="middle" fill="#444">pull calendar + tasks,</text><text x="130" y="184" text-anchor="middle" fill="#444">save raw, return</text><text x="130" y="206" text-anchor="middle" fill="#444">lean indexes</text>
<rect x="265" y="80" width="200" height="150" rx="12" fill="#EEF2FF" stroke="#8FB8FF"/><text x="365" y="110" text-anchor="middle" font-weight="700" fill="#1B1F3B">0b · How you write</text><text x="365" y="140" text-anchor="middle" fill="#444">Agent restates the</text><text x="365" y="162" text-anchor="middle" fill="#444">writing standard in</text><text x="365" y="184" text-anchor="middle" fill="#444">its own words</text>
<rect x="500" y="80" width="200" height="150" rx="12" fill="#FFF1EB" stroke="#DA7857"/><text x="600" y="110" text-anchor="middle" font-weight="700" fill="#1B1F3B">1 · Five questions</text><text x="600" y="140" text-anchor="middle" fill="#444">About last week,</text><text x="600" y="162" text-anchor="middle" fill="#444">one at a time, each</text><text x="600" y="184" text-anchor="middle" fill="#444">built on your last</text><text x="600" y="206" text-anchor="middle" fill="#444">answer</text>
<rect x="735" y="80" width="200" height="150" rx="12" fill="#EEF2FF" stroke="#8FB8FF"/><text x="835" y="110" text-anchor="middle" font-weight="700" fill="#1B1F3B">2 · Build the report</text><text x="835" y="140" text-anchor="middle" fill="#444">6 sections; critic +</text><text x="835" y="162" text-anchor="middle" fill="#444">fact-checker agents;</text><text x="835" y="184" text-anchor="middle" fill="#444">check.py gates every</text><text x="835" y="206" text-anchor="middle" fill="#444">number and date</text>
<rect x="970" y="80" width="200" height="150" rx="12" fill="#FFF1EB" stroke="#DA7857"/><text x="1070" y="110" text-anchor="middle" font-weight="700" fill="#1B1F3B">3 · You choose</text><text x="1070" y="140" text-anchor="middle" fill="#444">Fix it · Approve it ·</text><text x="1070" y="162" text-anchor="middle" fill="#444">Advice only. Writes</text><text x="1070" y="184" text-anchor="middle" fill="#444">happen only after</text><text x="1070" y="206" text-anchor="middle" fill="#444">"approve"</text>
</g>
<g stroke="#9EA2C8" stroke-width="2.5" marker-end="url(#a)"><line x1="232" y1="155" x2="261" y2="155"/><line x1="467" y1="155" x2="496" y2="155"/><line x1="702" y1="155" x2="731" y2="155"/><line x1="937" y1="155" x2="966" y2="155"/></g>
<g font-size="14"><rect x="30" y="280" width="1140" height="120" rx="12" fill="#F7F7FA" stroke="#E2E2EA"/>
<text x="60" y="310" font-weight="700" fill="#1B1F3B">Inputs</text><text x="60" y="335" fill="#444">Google Calendar · Asana (or other task tool)</text><text x="60" y="357" fill="#444">Your context docs · last week's plan</text>
<text x="470" y="310" font-weight="700" fill="#1B1F3B">Safeguards</text><text x="470" y="335" fill="#444">Never reads email · numbers computed, not guessed</text><text x="470" y="357" fill="#444">Fresh-context review · nothing written before approval</text>
<text x="900" y="310" font-weight="700" fill="#1B1F3B">Outputs</text><text x="900" y="335" fill="#444">Plan Card + 6-section report</text><text x="900" y="357" fill="#444">Calendar blocks + task tags</text>
<text x="600" y="388" text-anchor="middle" fill="#DA7857" font-size="13">Orange = where you speak · Blue = where the agent works</text></g>
</svg>
